name: WonderNest Native Android Offline Startup Smoke Test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-smoke.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  android-offline-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download verified v0.2 APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh run download 43567509391 --repo "$GH_REPO" --name WonderNest-v0.2.0-Installable-APK --dir downloaded
          test -s downloaded/app-release.apk
          unzip -Z -1 downloaded/app-release.apk | grep -F 'assets/index.android.bundle'

      - name: Enable hardware-accelerated Android emulator
        run: |
          set -e
          if [ ! -e /dev/kvm ]; then
            echo "::error::Hosted runner has no KVM device; native emulator unavailable"
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm

      - name: Emulator offline launch and restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            adb install -r downloaded/app-release.apk
            adb shell svc wifi disable
            adb shell svc data disable || true
            adb logcat -c
            adb shell am force-stop com.wondernest.memoryadventure || true
            adb shell am start -n com.wondernest.memoryadventure/.MainActivity
            sleep 20
            # Save logs/screenshot BEFORE any optional UI hierarchy step.
            adb logcat -d -s AndroidRuntime:E ReactNativeJS:E > WonderNest-emulator-errors.log
            adb exec-out screencap -p > WonderNest-emulator-screenshot.png
            test -s WonderNest-emulator-screenshot.png
            if grep -Eq 'FATAL EXCEPTION|Unable to load script|Cannot find module' WonderNest-emulator-errors.log; then echo "::error::Android startup crash detected"; exit 1; fi
            adb shell pidof com.wondernest.memoryadventure | grep -E '[0-9]'
            # Pull from shell-readable temp directory. /sdcard failed previously.
            adb shell uiautomator dump /data/local/tmp/wondernest-window.xml || true
            adb exec-out cat /data/local/tmp/wondernest-window.xml > WonderNest-emulator-ui.xml || true
            test ! -s WonderNest-emulator-ui.xml || grep -Eq 'WonderNest|Welcome|parent PIN|वंडरनेस्ट' WonderNest-emulator-ui.xml
            # App must be able to restart offline without Metro.
            adb shell am force-stop com.wondernest.memoryadventure
            adb shell monkey -p com.wondernest.memoryadventure 1
            sleep 10
            adb shell pidof com.wondernest.memoryadventure | grep -E '[0-9]'
            adb logcat -d -s AndroidRuntime:E ReactNativeJS:E > WonderNest-emulator-restart-errors.log
            if grep -Eq 'FATAL EXCEPTION|Unable to load script|Cannot find module' WonderNest-emulator-restart-errors.log; then echo "::error::Android restart crash detected"; exit 1; fi
            echo "PASS: installed and launched Android app twice with network disabled."

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WonderNest-v0.2.0-Emulator-Startup-Evidence
          path: |
            WonderNest-emulator-ui.xml
            WonderNest-emulator-screenshot.png
            WonderNest-emulator-errors.log
            WonderNest-emulator-restart-errors.log
          if-no-files-found: warn
          retention-days: 30
