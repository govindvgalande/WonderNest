name: Build WonderNest Standalone APK from Verified Source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

concurrency:
  group: wondernest-android-standalone-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Use verified editable WonderNest application source
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json && test -f app.json
          echo "APP_DIR=." >> "$GITHUB_ENV"
          echo "Building source currently committed on main, not the old uploaded ZIP"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager unavailable on runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null
          # Android SDK 37 is distributed as android-37.0; some AGP versions resolve android-37.
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Install project dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Check types, game logic, database migrations and assets
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm run check
          npm run test:core
          python3 tests/sqlite_contract.test.py
          python3 tests/assets_config_contract.test.py

      - name: Generate native Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install --non-interactive --clean

      - name: Compile standalone Android APK (include offline JavaScript)
        working-directory: ${{ env.APP_DIR }}/android
        env:
          CI: "1"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::Signed release APK was not produced"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/index.android.bundle' || { echo "::error::Standalone JavaScript bundle is missing"; exit 1; }
          echo "Verified: standalone APK includes the React Native JavaScript bundle."
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload WonderNest APK
        uses: actions/upload-artifact@v4
        with:
          name: WonderNest-v0.2.0-Installable-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
