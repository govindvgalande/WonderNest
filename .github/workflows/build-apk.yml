name: Build WonderNest APK (from ZIP)
on:
  push:
    branches: [main]
    paths:
      - "WonderNest*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract uploaded WonderNest source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'WonderNest*.zip' | sort | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Upload WonderNest_Android_Project_Ready_To_Upload.zip to the root of this repository"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/WonderNest/package.json || { echo "::error::ZIP does not contain WonderNest/package.json"; exit 1; }
          echo "APP_DIR=extracted/WonderNest" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API and build tools
        run: sdkmanager --install "platforms;android-37" "platforms;android-36" "build-tools;37.0.0" > /dev/null

      - name: Install project dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Check types and core logic
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm run check
          npm run test:core

      - name: Generate native Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install --non-interactive --clean

      - name: Compile installable Android APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload WonderNest APK
        uses: actions/upload-artifact@v4
        with:
          name: WonderNest-Installable-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
