name: Build WonderNest APK (from ZIP)
on:
  push:
    branches: [main]
    paths:
      - "WonderNest*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract uploaded WonderNest source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'WonderNest*.zip' | sort | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Upload WonderNest_Android_Project_Ready_To_Upload.zip to the root of this repository"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/WonderNest/package.json || { echo "::error::ZIP does not contain WonderNest/package.json"; exit 1; }
          echo "APP_DIR=extracted/WonderNest" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager unavailable on runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null
          # Android SDK 37 is distributed as android-37.0; some AGP versions resolve android-37.
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Install project dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Check types and core logic
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm run check
          npm run test:core

      - name: Generate native Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install --non-interactive --clean

      - name: Compile installable Android APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload WonderNest APK
        uses: actions/upload-artifact@v4
        with:
          name: WonderNest-Installable-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
